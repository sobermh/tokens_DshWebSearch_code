name: Verify and Publish to Private npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable tag to publish (leave empty for checks only)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

env:
  PRIVATE_REGISTRY: https://npm.tokensapi.ai/
  PUBLIC_REGISTRY: https://registry.npmjs.org/
  PACKAGE_NAME: tokens-dsh-web-search
  APPROVED_PUBLISHER: tokenscowork

jobs:
  check:
    name: Test and verify package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
      package-check: ${{ steps.checker.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.tokensapi.ai/

      - name: Validate release identity
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: node scripts/validate-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

      # 依赖来自公共源；setup-node 写入的 .npmrc 只用于发布方向。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry="$PUBLIC_REGISTRY"

      # 只执行独立回归；宿主用例明确报告未执行，不计入通过数量。
      - name: Run tests
        run: pnpm test -- --standalone

      - name: Pack verified release
        if: github.repository == 'sobermh/tokens_DshWebSearch_code' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --pack-destination .release

      # 发布包检查是附加门禁：未配置只读 Secret 时跳过检查但不阻断发布；
      # 一旦配置，账号必须是 market，配错仍在发布前失败。
      - name: 检查 · 发布包检查的只读凭证
        id: checker
        if: github.repository == 'sobermh/tokens_DshWebSearch_code' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::warning::未配置只读 Secret PLUGIN_CHECK_REGISTRY_TOKEN，本次跳过发布包检查'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || { echo '::error::包检查需要 market 只读账号'; exit 1; }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Publish to Verdaccio
        if: github.repository == 'sobermh/tokens_DshWebSearch_code' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'Configure the VERDACCIO_PUBLISH_TOKEN repository secret before releasing.' >&2
            exit 1
          fi
          publisher="$(npm whoami --registry="$PRIVATE_REGISTRY")"
          if [ "$publisher" != "$APPROVED_PUBLISHER" ]; then
            echo 'The registry token does not belong to the approved publisher.' >&2
            exit 1
          fi
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          # 禁止覆盖已发布版本：命中就直接失败，改版本号后重发。
          published="$(npm view "$PACKAGE_NAME@$version" version --registry="$PRIVATE_REGISTRY" 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "$PACKAGE_NAME@$version is already published; bump the version instead of overwriting." >&2
            exit 1
          fi
          npm publish .release/*.tgz --ignore-scripts --registry="$PRIVATE_REGISTRY" --tag=latest
          npm view "$PACKAGE_NAME@$version" version --registry="$PRIVATE_REGISTRY"
      - name: 报告 · 输出已发布的准确版本
        id: package
        if: github.repository == 'sobermh/tokens_DshWebSearch_code' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        run: node -p '"package=" + require("./package.json").name + "@" + require("./package.json").version' >> "$GITHUB_OUTPUT"

  package-check:
    name: 检查 · 插件发布包
    needs: check
    if: needs.check.outputs.package != '' && needs.check.outputs.package-check == 'true'
    uses: TokensAPI/tokens_DshPluginCheck_code/.github/workflows/check-plugin-package.yml@e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    with:
      package: ${{ needs.check.outputs.package }}
      checker_ref: e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
